<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم LIVEPLUS | السيرفر المحلي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E50914;
            --bg: #0b0b0b;
            --surface: #1a1a1a;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body { background: var(--bg); color: var(--text); padding: 40px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }

        .logo { font-size: 24px; font-weight: 900; color: var(--primary); }

        .card { background: var(--surface); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .form-group { margin-bottom: 20px; }

        label { display: block; margin-bottom: 10px; font-weight: 700; }

        input, select {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
        }

        .btn {
            background: var(--primary);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover { background: #ff0f1b; transform: translateY(-2px); }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }

        .stat-card { background: var(--surface); padding: 20px; border-radius: 12px; text-align: center; }

        .stat-card h3 { font-size: 14px; color: #777; margin-bottom: 5px; }

        .stat-card p { font-size: 28px; font-weight: 900; color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <div class="logo">LIVEPLUS SERVER DASHBOARD</div>
        <div class="status">🟢 السيرفر يعمل الآن</div>
    </header>

    <div class="stats">
        <div class="stat-card">
            <h3>عدد الأفلام</h3>
            <p id="movie-count">2</p>
        </div>
        <div class="stat-card">
            <h3>المسلسلات</h3>
            <p id="series-count">0</p>
        </div>
        <div class="stat-card">
            <h3>القنوات المباشرة</h3>
            <p id="channel-count">1</p>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-bottom: 20px;">إضافة محتوى جديد</h2>
        <form id="add-form">
            <div class="form-group">
                <label>العنوان</label>
                <input type="text" placeholder="مثلاً: فيلم باتمان">
            </div>
            <div class="form-group">
                <label>التصنيف</label>
                <select>
                    <option>ACTION</option>
                    <option>FNTACY</option>
                    <option>COMEDY</option>
                    <option>HORROR</option>
                </select>
            </div>
            <div class="form-group">
                <label>ملف الفيديو (مسار محلي)</label>
                <input type="text" placeholder="C:/Movies/Batman.mp4">
            </div>
            <button type="button" class="btn">إضافة للسيرفر</button>
        </form>
    </div>

</body>
</html>
