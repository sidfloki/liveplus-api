<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LivePlus Web Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --bg: #141414;
            --card-bg: #1f1f1f;
            --text: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        header {
            padding: 2rem;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 1.5rem;
        }

        .stat-item {
            background: var(--card-bg);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #333;
        }

        .container {
            padding: 0 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin: 2rem 0 1rem;
            border-right: 4px solid var(--primary);
            padding-right: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .card-img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #222;
        }

        .card-info {
            padding: 0.8rem;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        #loading {
            text-align: center;
            padding: 5rem;
            font-size: 1.2rem;
        }

        .filter-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .tab {
            padding: 0.5rem 1.5rem;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--primary);
            border-color: var(--primary);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">LivePlus</div>
    <div class="stats" id="stats-container">
        <!-- Stats will appear here -->
    </div>
</header>

<div class="container">
    <div class="filter-tabs" id="category-tabs">
        <div class="tab active" onclick="filterCategory('all')">الكل</div>
    </div>

    <div id="loading">جاري تحميل قائمة التشغيل...</div>
    <div class="grid" id="main-grid"></div>
</div>

<script>
    let playlistItems = [];
    let categories = new Set();

    async function loadPlaylist() {
        try {
            const response = await fetch('playlist.m3u');
            const text = await response.text();
            parseM3U(text);
        } catch (error) {
            console.error('Error loading playlist:', error);
            document.getElementById('loading').innerHTML = 'تعذر تحميل القائمة. تأكد من وجود ملف playlist.m3u';
        }
    }

    function parseM3U(content) {
        const lines = content.split('\n');
        let currentItem = null;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                const info = line;
                const name = info.split(',')[1] || 'Unknown';
                const logoMatch = info.match(/tvg-logo="([^"]*)"/);
                const groupMatch = info.match(/group-title="([^"]*)"/);
                
                currentItem = {
                    name: name,
                    logo: logoMatch ? logoMatch[1] : '',
                    category: groupMatch ? groupMatch[1] : 'عام',
                    url: ''
                };
                if (currentItem.category) categories.add(currentItem.category);
            } else if (line.startsWith('http')) {
                if (currentItem) {
                    currentItem.url = line;
                    playlistItems.push(currentItem);
                    currentItem = null;
                }
            }
        }

        renderDashboard();
    }

    function renderDashboard() {
        document.getElementById('loading').style.display = 'none';
        
        // Render Tabs
        const tabsContainer = document.getElementById('category-tabs');
        categories.forEach(cat => {
            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.innerText = cat;
            tab.onclick = () => filterCategory(cat, tab);
            tabsContainer.appendChild(tab);
        });

        // Render Stats
        const statsContainer = document.getElementById('stats-container');
        statsContainer.innerHTML = `
            <div class="stat-item">القنوات: ${playlistItems.length}</div>
            <div class="stat-item">الفئات: ${categories.size}</div>
        `;

        displayItems(playlistItems);
    }

    function displayItems(items) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = '';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img class="card-img" src="${item.logo || 'https://via.placeholder.com/200x300?text=LivePlus'}" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                <div class="badge">${item.category}</div>
                <div class="card-info">
                    <div class="card-title">${item.name}</div>
                    <div class="card-meta">اضغط للتشغيل</div>
                </div>
            `;
            card.onclick = () => window.open(item.url, '_blank');
            grid.appendChild(card);
        });
    }

    function filterCategory(cat, tabElement) {
        // Update tabs
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (tabElement) tabElement.classList.add('active');
        else document.querySelector('.tab').classList.add('active');

        if (cat === 'all') {
            displayItems(playlistItems);
        } else {
            const filtered = playlistItems.filter(i => i.category === cat);
            displayItems(filtered);
        }
    }

    window.onload = loadPlaylist;
</script>

</body>
</html>
